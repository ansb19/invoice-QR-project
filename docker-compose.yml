services:
  app:
    image: ansb19/invoice_qr:latest
    container_name: invoice_qr
    ports:
      - "80:80" # EC2의 80번 포트를 컨테이너 내부 포트에 매핑
    depends_on:
      - redis
    env_file:
      - /home/ec2-user/.env/.env
    networks:
      - app_network

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_network
    command: redis-server --requirepass invoice_qr

volumes:
  redis_data:


networks:
  app_network:
    driver: bridge
